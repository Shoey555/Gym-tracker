px 0}.tabs button{flex:1;min-width:0;padding:10px 3px}.progress{height:8px;background:var(--raised);border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;background:var(--accent);height:100%;transition:width .2s}.exercise{padding:15px 0;border-top:1px solid var(--line)}.exercise:first-child{border-top:0}.sets{display:grid;grid-template-columns:32px minmax(70px,1fr) minmax(65px,1fr) 42px;gap:7px;align-items:center;margin-top:9px}.sets input{width:100%;text-align:center}.sets .tick{width:42px;display:flex;justify-content:center}.setdone{opacity:.75}.tag{display:inline-block;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:2px 7px;border-radius:7px;margin-top:4px}.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.stat{background:var(--raised);border-radius:13px;padding:11px}.stat strong{display:block;font-size:21px}.nav{position:fixed;z-index:10;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:5px}.nav button{flex:1;max-width:180px;background:transparent;border:0;color:var(--muted);font-size:13px}.nav button.active{color:var(--accent);background:var(--raised)}.timer{position:sticky;top:env(safe-area-inset-top);z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px;margin:12px 0;box-shadow:var(--shadow)}.timer strong{font-variant-numeric:tabular-nums;font-size:22px}.notice{border-left:3px solid var(--accent);padding-left:10px;color:var(--muted);font-size:13px;margin-top:12px}.danger{color:var(--danger)}.history-item{padding:12px 0;border-top:1px solid var(--line)}details summary{cursor:pointer;padding:8px 0;font-weight:650}textarea{width:100%;resize:vertical}.full{width:100%}.spaced{margin-top:12px}.weekgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.weekgrid button{padding:8px 3px;font-size:13px}.chart {day:'Wed',title:'Chest, Shoulders, Triceps & Abs',focus:'Heavy chest development and shoulder width',note:'Incline machine: start around 30 kg per side. Flat dumbbells: 32 kg each if the target reps are achievable after incline pressing.',ex:[['Incline Machine Chest Press','Upper chest',3,'6–10','kg/side',180],['Flat Dumbbell Press','Overall chest',3,'8–12','kg/hand',180],['Pec Deck Fly','Chest',2,'10–15','kg',90],['Cable Lateral Raise','Side delts',4,'12–20','kg/side',90],['Overhead Cable Triceps Extension','Triceps',3,'10–15','kg',90],['Weighted Cable Crunch','Abs',3,'10–15','kg',90]]},
{day:'Thu',title:'Back, Rear Delts & Biceps',focus:'Lat width, V-taper and arms',note:'Use controlled repetitions, a comfortable stretch and minimal momentum.',ex:[['Lat Pulldown','Lats',3,'8–12','kg',150],['Chest-Supported Row','Mid-back & lats',3,'8–12','kg',150],['Reverse Pec Deck','Rear delts',3,'12–20','kg',90],['Incline Dumbbell Curl','Biceps',3,'8–12','kg/hand',90],['Hammer Curl','Brachialis & forearms',2,'10–15','kg/hand',90]]},

{day:'Sat',title:'Chest, Shoulders & Triceps',focus:'Chest fullness and rounded shoulders',note:'Use a slightly lighter incline load than Wednesday if needed for the higher rep range.',ex:[['Incline Machine Chest Press','Upper chest',3,'8–12','kg/side',180],['Flat Machine Chest Press','Overall chest',2,'8–12','kg/side or stack',150],['Low-to-High Cable Fly','Upper chest emphasis',2,'12–15','kg/side',90],['Machine Lateral Raise','Side delts',4,'12–20','kg',90],['Cable Triceps Pushdown','Triceps',3,'10–15','kg',90]]},
{day:'Sun',title:'Back, Legs & Abs',focus:'Lat width, back thickness, posterior chain and core',note:'Romanian deadlifts train hamstrings, glutes and spinal erectors. Maintain a neutral spine, stop before losing control, and leave 2–3 reps in reserve initially. Keep leg press moderate after Friday; no additional loaded back extensions needed. Sauna optional; rehydrate.',ex:[['Romanian Deadlift','Hamstrings, glutes & spinal erectors',3,'8–12','kg',180],['Neutral-Grip Lat Pulldown','Lats',3,'8–12','kg',150],['Chest-Supported Row','Mid-back & lats',2,'8–12','kg',150],['Leg Press','Quads & glutes',2,'10–15','kg',150],['Seated Hamstring Curl','Hamstrings',2,'10–15','kg',90],['Standing Calf Raise','Calves',2,'12–20','kg',90],['Weighted Cable Crunch','Abs',2,'10–15','kg',90]]}
];
const OLD_SUNDAY={day:'Sun',title:'Back, Rear Delts, Biceps & Abs',focus:'Back thickness and proportions',note:'Keep your last session productive. Sauna afterwards if desired; rehydrate.',ex:[['Chest-Supported Row','Mid-back',3,'8–12','kg',150],['Neutral-Grip Lat Pulldown','Lats',3,'8–12','kg',150],['Rear Delt Cable Fly','Rear delts',2,'12–20','kg/side',90],['Preacher Curl','Biceps',3,'8–12','kg',90],['Ab Wheel Rollout','Abs & core',2,'8–12','kg added',60,'optional']]};
const OLD_FRIDAY={day:'Fri',title:'Legs & Abs',focus:'Lower-body growth and stability',note:'Use comfortable ranges. Split squats only if your knee is stable, comfortable and cleared. Do not push through knee pain, swelling or instability.',ex:[['Leg Press','Quads & glutes',3,'8–12','kg',180],['Romanian Deadlift','Hamstrings & glutes',3,'8–12','kg',180],['Seated Hamstring Curl','Hamstrings',3,'10–15','kg',90],['Supported Split Squat','Quads & glutes',2,'10–12','kg/hand',150,'conditional'],['Standing Calf Raise','Calves',3,'12–20','kg',90],['Hanging Knee Raise','Abs & hip flexors',3,'10–15','kg added',60]]};
const V2_SUNDAY={day:'Sun',title:'Lower Back, Legs & Abs',focus:'Posterior chain, lower-body development and core',note:'Keep this session moderate after Friday legs. Use controlled, comfortable knee ranges; no heavy deadlifts. Back extensions: hinge at the hips, finish at neutral, and stop if pain occurs. Sauna optional; rehydrate.',ex:[['Leg Press','Quads & glutes',3,'10–15','kg',150],['Seated Hamstring Curl','Hamstrings',2,'10–15','kg',90],['45-Degree Back Extension','Spinal erectors & glutes',2,'12–15','kg added',90],['Standing Calf Raise','Calves',3,'12–20','kg',90],['Weighted Cable Crunch','Abs',3,'10–15','kg',90]]};
const planFor=(d,s)=>!s||s.planVersion==='glutes-v3'?PLAN[d]:d===2?OLD_FRIDAY:d===4?(s.planVersion==='lower-v2'?V2_SUNDAY:OLD_SUNDAY):PLAN[d];
const KEY='gym-tracker-chest-v1';const DEFAULT={start:'2026-11-25',theme:'dark',sessions:{},measurements:{}};let storageOK=true;let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(DEFAULT)}catch{data=structuredClone(DEFAULT);storageOK=false}let view='workout',day=0,week=0,chartDay=0,chartExercise=0,timerEnd=0,timerLength=0,timerInterval=null;
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safeNum=v=>v!==''&&Number.isFinite(Number(v))&&Number(v)>=0;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true}catch{storageOK=false;const x=$('#storage-warning');if(x)x.hidden=false}}function localDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function dateFor(w,d){const x=new Date(data.start+'T12:00:00');x.setDate(x.getDate()+w*7+d);return x}function niceDate(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}function initDate(){const now=new Date(),start=new Date(data.start+'T12:00:00');const diff=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(start.getFullYear(),start.getMonth(),start.getDate()))/86400000);week=Math.max(0,Math.min(11,Math.floor(diff/7)));day=diff>=0?Math.min(4,diff%7):0;chartDay=day;document.documentElement.dataset.theme=data.theme||'dark'}initDate();
function session(w=week,d=day){let k=w+'-'+d,prev=data.sessions[k];if((d===2||d===4)&&prev&&prev.planVersion!=='glutes-v3'&&!prev.finished&&!prev.notes&&!prev.sets.some(a=>a.some(x=>x.done||x.kg!==''||x.reps!=='')))delete data.sessions[k];if(!data.sessions[k])data.sessions[k]={planVersion:'glutes-v3',sets:PLAN[d].ex.map(e=>Array.from({length:e[2]},()=>({kg:'',reps:'',done:false}))),skip:{},notes:'',finished:false};return data.sessions[k]}function existing(w,d){return data.sessions[w+'-'+d]}function counts(s,d){const ex=planFor(d,s).ex;let total=0,done=0;for(let i=0;i<ex.length;i++){if(s?.skip?.[i])continue;total+=ex[i][2];done+=(s?.sets?.[i]||[]).filter(x=>x.done).length}return{total,done}}function finished(w,d){return !!existing(w,d)?.finished}function lastSet(e,i){for(let w=week-1;w>=0;w--){const prev=existing(w,day),name=planFor(day,session()).ex[e][0],idx=planFor(day,prev).ex.findIndex(y=>y[0]===name),x=prev?.sets?.[idx]?.[i];if(x&&x.done)return x}return null}function summary(w){let total=0,done=0,days=0;PLAN.forEach((p,d)=>{let c=counts(existing(w,d),d);total+=c.total;done+=c.done;if(finished(w,d))days++});return{total,done,days}}function updateHeader(){const c=counts(session(),day);const p=$('#workout-progress');if(p){p.innerHTML=`<div class="row between"><small>${c.done}/${c.total} sets completed</small><small>${Math.round(100*c.done/Math.max(1,c.total))}%</small></div><div class="progress"><span style="width:${100*c.done/Math.max(1,c.total)}%"></span></div>`;const b=$('#finish');b.disabled=c.done!==c.total||c.total===0||session().finished;b.textContent=session().finished?'Workout saved ✓':'Finish workout';}const sum=summary(week);const label=$('#week-count');if(label)label.textContent=sum.days+'/5 workouts saved'}
function timerHTML(){return `<div class="timer row between wrap"><div><small>REST TIMER</small><div><strong id="clock">00:00</strong></div></div><div class="row wrap"><button data-time="90">90s</button><button data-time="180">3m</button><button id="stop-timer" class="ghost">Stop</button></div></div>`}function tick(){const left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const x=$('#clock');if(x)x.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(timerEnd&&left===0){timerEnd=0;clearInterval(timerInterval);timerInterval=null;if(navigator.vibrate)navigator.vibrate([150,100,150]);if(x)x.textContent='Ready!'}}function startTimer(s){timerLength=s;timerEnd=Date.now()+s*1000;clearInterval(timerInterval);timerInterval=setInterval(tick,250);tick()}function stopTimer(){timerEnd=0;clearInterval(timerInterval);timerInterval=null;tick()}
function workoutHTML(){const s=session(),p=planFor(day,s);let exercises=p.ex.map((e,i)=>{const skipped=!!s.skip[i];return `<section class="exercise"><div class="row between"><div class="grow"><h3>${esc(e[0])}</h3><small>${esc(e[1])} · ${e[2]} × ${e[3]} · ${esc(e[4])}</small>${e[6]?`<div class="tag">${e[6]}</div>`:''}</div>${e[6]?`<button data-skip="${i}" class="ghost">${skipped?'Include':'Skip'}</button>`:''}</div>${skipped?'<p class="muted spaced">Not included in this workout.</p>':`<div class="sets muted"><small>Set</small><small>Weight</small><small>Reps</small><small>Done</small></div>${s.sets[i].map((v,j)=>{const last=lastSet(i,j);return `<div class="sets ${v.done?'setdone':''}"><small>${j+1}${last?`<span title="Previous: ${esc(last.kg)} kg × ${esc(last.reps)}"> ↗</span>`:''}</small><input aria-label="${esc(e[0])} set ${j+1} weight" type="number" inputmode="decimal" min="0" step="any" data-field="kg" data-e="${i}" data-s="${j}" value="${esc(v.kg)}" placeholder="${last&&last.kg!==''?esc(last.kg):'kg'}"><input aria-label="${esc(e[0])} set ${j+1} reps" type="number" inputmode="numeric" min="1" step="1" data-field="reps" data-e="${i}" data-s="${j}" value="${esc(v.reps)}" placeholder="${last&&last.reps!==''?esc(last.reps):e[3]}"><label class="tick"><input aria-label="Complete ${esc(e[0])} set ${j+1}" type="checkbox" data-done="${i}-${j}" ${v.done?'checked':''}></label></div>`}).join('')}<div class="row between spaced"><small>${s.sets[i].filter(v=>v.done).length}/${e[2]} sets</small><button class="ghost" data-time="${e[5]}">Rest ${e[5]}s</button></div>`}</section>`}).join('');return `<div class="panel"><div class="row between"><button id="prev-week" ${week===0?'disabled':''} aria-label="Previous week">‹</button><div style="text-align:center"><div class="eyebrow">Week ${week+1} / 12</div><strong>${niceDate(dateFor(week,0))} – ${niceDate(dateFor(week,4))}</strong><div><small id="week-count">${summary(week).days}/5 workouts saved</small></div></div><button id="next-week" ${week===11?'disabled':''} aria-label="Next week">›</button></div><div class="tabs">${PLAN.map((p,i)=>`<button data-day="${i}" class="${i===day?'active':''}">${p.day}${finished(week,i)?' ✓':''}</button>`).join('')}</div><h2>${esc(p.title)}</h2><p class="muted">${esc(p.focus)}</p><div id="workout-progress"></div><p class="notice">${esc(p.note)}</p></div>${timerHTML()}<div class="panel" style="padding-top:0">${exercises}</div><div class="panel"><label for="notes"><strong>Session notes</strong></label><textarea id="notes" rows="3" class="spaced" placeholder="Energy, form, pain, or progress…">${esc(s.notes)}</textarea><button id="finish" class="primary full spaced">Finish workout</button><button id="reset-session" class="ghost full spaced">Clear this session</button><p class="muted spaced"><small>Set entries save automatically on this device. Previous week's values appear as placeholders; enter actual values before ticking each set. Enter 0 for bodyweight/no added weight.</small></p></div>`}
function progressHTML(){let s=summary(week);const e=PLAN[chartDay].ex[chartExercise];const values=Array.from({length:12},(_,w)=>{const prev=existing(w,chartDay),idx=planFor(chartDay,prev).ex.findIndex(y=>y[0]===e[0]);const sets=prev?.sets?.[idx]||[];const valid=sets.filter(x=>x.done&&safeNum(x.kg)&&Number(x.kg)>0&&Number(x.reps)>0);return valid.length?Math.max(...valid.map(x=>Number(x.kg))):null});const max=Math.max(1,...values.filter(v=>v!==null));const m=data.measurements[week]||{};return `<div class="panel"><div class="eyebrow">Training block</div><h2>Your progress</h2><div class="statgrid"><div class="stat"><small>Workouts saved</small><strong>${Object.values(data.sessions).filter(x=>x.finished).length}/60</strong></div><div class="stat"><small>Week ${week+1} workouts</small><strong>${s.days}/5</strong></div><div class="stat"><small>Week ${week+1} sets</small><strong>${s.done}/${s.total}</strong></div><div class="stat"><small>Rest days</small><strong>Mon · Tue</strong></div></div><div class="weekgrid spaced">${Array.from({length:12},(_,w)=>`<button data-week="${w}" class="${week===w?'active':''}">W${w+1}<br><small style="color:inherit">${summary(w).days}/5</small></button>`).join('')}</div></div><div class="panel"><h2>Strength trend</h2><p class="muted">Heaviest completed set each week; same exercise and day.</p><div class="row spaced"><select id="chart-day" aria-label="Workout day" class="grow">${PLAN.map((p,i)=>`<option value="${i}" ${i===chartDay?'selected':''}>${p.day}</option>`).join('')}</select><select id="chart-ex" aria-label="Exercise" class="grow">${PLAN[chartDay].ex.map((e,i)=>`<option value="${i}" ${i===chartExercise?'selected':''}>${esc(e[0])}</option>`).join('')}</select></div><p class="spaced"><strong>${esc(e[0])}</strong> <small>${esc(e[4])}</small></p><div class="chart" role="img" aria-label="Weekly heaviest set: ${values.map((v,w)=>'Week '+(w+1)+': '+(v??'no data')).join(', ')}">${values.map((v,w)=>`<div class="barcol"><small>${v??'–'}</small><div class="bar" style="height:${v===null?2:Math.max(2,100*v/max)}%" title="Week ${w+1}: ${v??'No data'}"></div><small>${w+1}</small></div>`).join('')}</div><div class="spaced"><small>For a fair comparison, keep equipment, range of motion and technique consistent. More reps at the same load is also progress.</small></div></div><div class="panel"><h2>Week ${week+1} measurements</h2><p class="muted">Optional. Measure under consistent conditions.</p>${[['weight','Average body weight (kg)'],['chest','Chest circumference (cm)'],['waist','Waist circumference (cm)']].map(([k,l])=>`<label class="row between spaced"><span>${l}</span><input style="width:100px" type="number" min="0" step="any" inputmode="decimal" data-measure="${k}" value="${esc(m[k]??'')}"></label>`).join('')}</div><div class="panel"><h2>Daily targets</h2><div class="statgrid"><div class="stat"><small>Calories (estimate)</small><strong>2,600</strong></div><div class="stat"><small>Protein</small><strong>160 g</strong></div><div class="stat"><small>Carbohydrates</small><strong>310 g</strong></div><div class="stat"><small>Fat</small><strong>80 g</strong></div></div><p class="notice">Review average weight and waist after two weeks. Aim for 7–9 hours of sleep. Increase resistance when all sets reach the top of the range with good form.</p></div>`}
function historyHTML(){const entries=Object.entries(data.sessions).filter(([k,s])=>s.finished||s.sets.some(a=>a.some(x=>x.done||x.kg!==''||x.reps!==''))).sort((a,b)=>{const [aw,ad]=a[0].split('-').map(Number),[bw,bd]=b[0].split('-').map(Number);return (bw*5+bd)-(aw*5+ad)});return `<div class="panel"><h2>Workout history</h2><p class="muted">Tap a session to view or edit your recorded sets.</p>${entries.length?entries.map(([k,s])=>{const[w,d]=k.split('-').map(Number);let c=counts(s,d);return `<div class="history-item row between spaced"><div class="grow"><strong>W${w+1} · ${PLAN[d].day} · ${niceDate(dateFor(w,d))}</strong><p class="muted">${esc(planFor(d,s).title)}</p><small>${c.done}/${c.total} sets · ${s.finished?'Saved':'In progress'}</small></div><button data-open="${k}">Open</button></div>`}).join(''):'<p class="notice">Your logged workouts will appear here.</p>'}</div>`}
function settingsHTML(){return `<div class="panel"><h2>Settings</h2><label class="row between spaced"><span>Block start (Wednesday)</span><input id="start-date" type="date" value="${esc(data.start)}"></label><p class="notice">Changing the date changes displayed dates only, not logged week numbers.</p><button id="export" class="full spaced">Export backup (JSON)</button><button id="restore" class="full spaced">Import backup</button><p class="muted spaced">Records are stored only in this browser on this device. Export backups regularly, especially before clearing Safari data or switching devices. No account or cloud sync is included.</p></div><div class="panel"><h2>Training rules</h2><p class="spaced">Compounds: 2–3 minutes rest, 1–2 reps in reserve. Isolation: 90–120 seconds, 0–2 reps in reserve. Leg compounds: 1–3 reps in reserve, subject to knee tolerance.</p><p class="spaced">Warm up before heavy lifts. Only take selected final isolation sets to technical failure. Deload when fatigue or performance decline warrants it. Review at week 12.</p><p class="notice">This is a chest-focused block with two lower-body sessions. Historical Friday and Sunday workouts retain their original exercise labels.</p></div><div class="panel"><h2>Data</h2><button id="wipe" class="full danger spaced">Delete all workout and measurement data</button></div>`}
function render(){document.documentElement.dataset.theme=data.theme||'dark';$('#app').innerHTML=`<p id="storage-warning" ${storageOK?'hidden':''} class="danger">Local storage is unavailable. Export a backup before closing.</p>`+({workout:workoutHTML,progress:progressHTML,history:historyHTML,settings:settingsHTML}[view]());document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-current',b.dataset.view===view?'page':'false')});if(view==='workout'){updateHeader();tick()}}
function openView(v){view=v;render();window.scrollTo({top:0,behavior:'instant'})}
function validateBackup(x){if(!x||typeof x!=='object'||!/^\d{4}-\d{2}-\d{2}$/.test(x.start)||!Number.isFinite(new Date(x.start+'T12:00:00').getTime())||new Date(x.start+'T12:00:00').getDay()!==3||!x.sessions||!x.measurements)throw Error('Invalid backup');const out={start:x.start,theme:x.theme==='light'?'light':'dark',sessions:{},measurements:{}};for(const [k,s]of Object.entries(x.sessions)){if(!/^(?:[0-9]|1[01])-[0-4]$/.test(k))continue;const d=Number(k.split('-')[1]),p=planFor(d,s);if(!Array.isArray(s.sets)||s.sets.length!==p.ex.length)throw Error('Workout structure does not match');let skip={};for(let i=0;i<p.ex.length;i++)if(p.ex[i][6]&&s.skip?.[i])skip[i]=true;out.sessions[k]={planVersion:['glutes-v3','lower-v2'].includes(s.planVersion)?s.planVersion:'original',sets:s.sets.map((a,i)=>{if(!Array.isArray(a)||a.length!==p.ex[i][2])throw Error('Set structure does not match');return a.map(v=>({kg:safeNum(v.kg)?String(v.kg):'',reps:safeNum(v.reps)&&Number(v.reps)>0?String(v.reps):'',done:!!v.done&&safeNum(v.kg)&&safeNum(v.reps)&&Number(v.reps)>0}))}),skip,notes:String(s.notes??'').slice(0,10000),finished:!!s.finished};const c=counts(out.sessions[k],d);out.sessions[k].finished=out.sessions[k].finished&&c.done===c.total}for(const[k,m]of Object.entries(x.measurements)){if(!/^(?:[0-9]|1[01])$/.test(k))continue;out.measurements[k]={};for(const f of ['weight','chest','waist'])if(safeNum(m[f]))out.measurements[k][f]=String(m[f])}return out}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const ds=b.dataset;if(ds.view){openView(ds.view);return}if(ds.day!==undefined){day=Number(ds.day);render();return}if(ds.week!==undefined){week=Number(ds.week);render();return}if(ds.open){[week,day]=ds.open.split('-').map(Number);openView('workout');return}if(ds.time){startTimer(Number(ds.time));return}if(ds.skip!==undefined){let s=session();const i=Number(ds.skip);if(!s.skip[i]&&s.sets[i].some(x=>x.done)&&!confirm('Skip this exercise? Its recorded sets will be retained but excluded from completion.'))return;s.skip[i]=!s.skip[i];s.finished=false;persist();render();return}switch(b.id){case'theme':data.theme=data.theme==='light'?'dark':'light';persist();render();break;case'prev-week':week=Math.max(0,week-1);render();break;case'next-week':week=Math.min(11,week+1);render();break;case'stop-timer':stopTimer();break;case'finish':{const s=session(),c=counts(s,day);if(c.done===c.total&&c.total){s.finished=true;persist();render()}break}case'reset-session':if(confirm('Clear all sets and notes for this day and week?')){delete data.sessions[week+'-'+day];persist();render()}break;case'export':{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-tracker-backup-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);break}case'restore':$('#import').click();break;case'wipe':if(confirm('Permanently delete all recorded workouts and measurements? Export a backup first.')){data.sessions={};data.measurements={};persist();render()}break}});
document.addEventListener('input',ev=>{const x=ev.target;if(x.dataset.field){let s=session(),v=s.sets[Number(x.dataset.e)][Number(x.dataset.s)];v[x.dataset.field]=x.value;if(v.done){v.done=false;s.finished=false;const cb=x.closest('.sets').querySelector('input[type=checkbox]');cb.checked=false;x.closest('.sets').classList.remove('setdone');updateHeader()}persist()}else if(x.id==='notes'){session().notes=x.value;persist()}else if(x.dataset.measure){(data.measurements[week]??={})[x.dataset.measure]=x.value;persist()}});
document.addEventListener('change',async ev=>{const x=ev.target;if(x.dataset.done){const[i,j]=x.dataset.done.split('-').map(Number),s=session(),v=s.sets[i][j];if(x.checked&&(!safeNum(v.kg)||!safeNum(v.reps)||Number(v.reps)<=0||!Number.isInteger(Number(v.reps)))){x.checked=false;alert('Enter actual weight (0 for bodyweight) and a whole number of reps first.');return}v.done=x.checked;s.finished=false;persist();if(v.done)startTimer(planFor(day,s).ex[i][5]);render()}else if(x.id==='chart-day'){chartDay=Number(x.value);chartExercise=0;render()}else if(x.id==='chart-ex'){chartExercise=Number(x.value);render()}else if(x.id==='start-date'){if(!x.value||new Date(x.value+'T12:00:00').getDay()!==3){alert('Choose a Wednesday.');render();return}data.start=x.value;persist();render()}else if(x.id==='import'){try{const file=x.files[0];if(!file)return;const next=validateBackup(JSON.parse(await file.text()));if(confirm('Replace all current data with this backup?')){data=next;persist();initDate();render()}}catch(e){alert('Could not import backup: '+e.message)}finally{x.value=''}}});
render();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
